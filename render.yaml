services:
  - type: web
    name: dotrag-backend
    runtime: python
    pythonVersion: "3.12"
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_CHAT_MODEL
        value: mistral-large-latest
      - key: MISTRAL_EMBEDDING_MODEL
        value: mistral-embed
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        value: ""
      - key: DATABASE_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: FRONTEND_URL
        value: https://dotrag-1.onrender.com
    healthCheckPath: /health

  - type: web
    name: dotrag-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
